<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>AI Travel Itinerary Planner</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

  <!-- HERO -->
  <div class="hero">

    <div class="hero-badge">
      <i class="fa-solid fa-location-dot"></i>
      Smart Travel Assistant
    </div>

    <h1>AI Travel Itinerary Planner</h1>

    <p>Build personalized trips with hotels, food, weather, and daily cost tracking.</p>

    <div class="button-group hero-buttons">

      <button class="btn secondary-btn" onclick="toggleTheme()">🌙 Theme</button>
      <button class="btn secondary-btn" onclick="exportJSON()">📄 Export</button>
      <button class="btn primary-btn" onclick="saveTrip()">💾 Save Trip</button>
      <button class="btn primary-btn" onclick="saveFavoriteTrip()">❤️ Favourite Trip</button>

    </div>

  </div>

  <!-- MAIN -->
  <div class="planner-card">

    <!-- FORM -->
    <div class="form-section">

      <input type="text" id="destination" placeholder="Destination">

      <div class="grid-2">
        <input type="date" id="startDate">
        <input type="number" id="days" placeholder="Days">
      </div>

      <div class="grid-2">

        <select id="budget">
          <option>Budget</option>
          <option>Mid-Range</option>
          <option>Luxury</option>
        </select>

        <select id="style">
          <option>Adventure</option>
          <option>Relaxation</option>
          <option>Cultural</option>
          <option>Romantic</option>
          <option>Food & Nightlife</option>
        </select>

        <select id="tripMood">
          <option value="all">Trip Mood</option>
          <option value="outdoor">Outdoor</option>
          <option value="indoor">Indoor</option>
          <option value="luxury">Luxury</option>
          <option value="budget">Budget Friendly</option>
        </select>

        <select id="currency">
          <option value="GBP">GBP (£)</option>
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
        </select>

      </div>

      <input type="number" id="travelers" value="2" min="1">

      <button class="btn primary-btn" onclick="generateItinerary()">
        ✨ Generate Itinerary
      </button>

      <button class="btn secondary-btn" onclick="downloadPlan()">
        ⬇ Download PDF
      </button>

    </div>

    <!-- RESULT -->
    <div class="result-section">

      <div class="result-header">
        <h2>Your Travel Plan</h2>
      </div>

      <div id="weatherBox"></div>
      <div id="tripSummary"></div>
      <div id="countdown"></div>
      <div id="map"></div>
      <div id="budgetBreakdown"></div>

      <canvas id="budgetChart"></canvas>

      <div id="expenseList"></div>

      <div id="itinerary"></div>

    </div>

  </div>

  <!-- FAVORITES -->
  <div id="favoriteTripsContainer">

    <div class="result-header">
      <h2>❤️ Favourite Trips</h2>
    </div>

    <div id="favoriteTripsList"></div>

  </div>

</div>

<div id="toast" class="toast"></div>

<script src="assets/js/script.js"></script>

</body>
</html>
