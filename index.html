<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Travel Itinerary Planner</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header>
  <div class="header-content">
    <h1>AI Travel Itinerary Planner</h1>
    <p>AI-powered itineraries with real-world data</p>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
</header>

<div class="container">

  <div class="form-grid">
    <div class="field">
      <label>Destination</label>
      <input id="destination" placeholder="Paris..." />
    </div>

    <div class="field">
      <label>Duration Days</label>
      <input type="number" id="days" min="1" max="14" value="3" />
    </div>

    <div class="field">
      <label>Travel Style</label>
      <select id="style">
        <option value="relaxed">Relaxed</option>
        <option value="balanced">Balanced</option>
        <option value="adventurous">Adventurous</option>
      </select>
    </div>
  </div>

  <button onclick="generateItinerary()" id="generateBtn">
    Generate AI Itinerary
  </button>

  <div class="loader" id="loader"></div>

  <div class="actions">
    <button onclick="copyItinerary()">Copy</button>
    <button onclick="saveItinerary()">Save</button>
    <button onclick="loadItinerary()">Load</button>
    <button onclick="exportJSON()">Export JSON</button>
  </div>

  <div id="output" class="itinerary"></div>

</div>

<script src="assets/js/script.js"></script>
</body>
</html>
