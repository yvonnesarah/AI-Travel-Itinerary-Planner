<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Travel Itinerary Planner</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <h1>AI Travel Itinerary Planner</h1>
    <p>Generate a smart travel plan instantly</p>
  </header>

  <div class="container">
    <label>Destination</label>
    <input type="text" id="destination" placeholder="e.g. Paris" />

    <label>Duration (days)</label>
    <input type="number" id="days" min="1" max="14" value="3" />

    <label>Travel Style</label>
    <select id="style">
      <option value="relaxed">Relaxed</option>
      <option value="balanced">Balanced</option>
      <option value="adventurous">Adventurous</option>
    </select>

    <button onclick="generateItinerary()">Generate Itinerary</button>

    <div id="output" class="itinerary"></div>
  </div>
<script src="assets/js/script.js"></script>
</body>
</html>
