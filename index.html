<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Travel Itinerary Planner</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <div class="container">

    <div class="hero">
      <h1>AI Travel Itinerary Planner</h1>
      <p>Create smart and personalized travel plans instantly.</p>
    </div>

    <div class="planner-card">

      <!-- FORM -->
      <div class="form-section">

        <div class="form-group">
          <label>Destination</label>
          <input type="text" id="destination" placeholder="e.g. Paris">
        </div>

        <div class="form-group">
          <label>Number of Days</label>
          <input type="number" id="days" min="1" max="14" placeholder="e.g. 5">
        </div>

        <div class="form-group">
          <label>Budget</label>
          <select id="budget">
            <option>Budget</option>
            <option>Mid-Range</option>
            <option>Luxury</option>
          </select>
        </div>

        <div class="form-group">
          <label>Travel Style</label>
          <select id="style">
            <option>Adventure</option>
            <option>Relaxation</option>
            <option>Cultural</option>
            <option>Romantic</option>
            <option>Food & Nightlife</option>
          </select>
        </div>

        <div class="form-group">
          <label>Special Preferences</label>
          <textarea id="preferences" placeholder="Museums, beaches, hiking, local food..."></textarea>
        </div>

        <button class="btn" onclick="generateItinerary()">
          Generate AI Itinerary
        </button>

      </div>

      <!-- RESULT -->
      <div class="result-section">
        <h2>Your Travel Plan</h2>

        <div id="itinerary">
          <div class="empty-state">
            Your AI itinerary will appear here.
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="assets/js/script.js"></script>
</body>
</html>
