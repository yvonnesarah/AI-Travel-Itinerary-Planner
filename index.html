<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Travel Itinerary Planner</title>
  
  <link rel="stylesheet" href="assets/css/style.css"/>

  <!-- SORTABLE -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

  <!-- PDF EXPORT -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

<header>

  <div class="header-content">
    <h1>AI Travel Itinerary Planner</h1>
    <p>Smart AI-powered travel planning</p>
  </div>

  <button class="theme-toggle" onclick="toggleTheme()">
    🌓
  </button>

</header>

<div class="container">

  <!-- FORM -->
  <div class="form-grid">

    <div class="field">
      <label>Destination</label>
      <input id="destination" placeholder="Paris..." />
    </div>

    <div class="field">
      <label>Duration</label>
      <input type="number" id="days" value="3" min="1" max="14"/>
    </div>

    <div class="field">
      <label>Travel Style</label>

      <select id="style">
        <option value="relaxed">Relaxed</option>
        <option value="balanced">Balanced</option>
        <option value="adventurous">Adventurous</option>
      </select>
    </div>

    <div class="field">
      <label>Trip Type</label>

      <select id="tripType">
        <option>Solo</option>
        <option>Couple</option>
        <option>Family</option>
        <option>Friends</option>
      </select>
    </div>

    <div class="field">
      <label>Budget ($)</label>
      <input type="number" id="budget" value="2000"/>
    </div>

    <div class="field">
      <label>Trip Start Date</label>
      <input type="date" id="tripDate"/>
    </div>

  </div>

  <button onclick="generateItinerary()" id="generateBtn">
    Generate AI Itinerary
  </button>

  <div class="loader" id="loader"></div>

  <!-- ACTIONS -->
  <div class="actions">

    <button onclick="copyItinerary()">Copy</button>

    <button onclick="saveItinerary()">Save</button>

    <button onclick="loadItinerary()">Load</button>

    <button onclick="exportJSON()">Export JSON</button>

    <button onclick="exportPDF()">Export PDF</button>

  </div>

  <!-- COUNTDOWN -->
  <div id="countdown"></div>

  <!-- BUDGET -->
  <div id="budgetBox"></div>

  <!-- OUTPUT -->
  <div id="output" class="itinerary"></div>

</div>

<script src="assets/js/script.js"></script>

</body>
</html>
